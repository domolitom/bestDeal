name: Scrape Catalogs

on:
  schedule:
    # Monday and Thursday at 6am UTC (most catalogs refresh weekly)
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 4"
  workflow_dispatch: {} # Manual trigger

permissions:
  contents: read
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        country:
          - austria
          - belgium
          - bosnia
          - bulgaria
          - croatia
          - czechia
          - denmark
          - estonia
          - finland
          - france
          - germany
          - greece
          - hungary
          - ireland
          - italy
          - latvia
          - lithuania
          - netherlands
          - norway
          - poland
          - portugal
          - romania
          - serbia
          - slovakia
          - slovenia
          - spain
          - sweden
          - switzerland
          - uk

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}

      # Install Playwright browsers (full install only on cache miss)
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd packages/scraper && bunx playwright install chromium --with-deps

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd packages/scraper && bunx playwright install-deps chromium

      - name: Scrape ${{ matrix.country }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        # Step-level timeout (< job timeout) makes a hang a real step failure
        # instead of a job cancellation, so notify-failure fires and the run
        # conclusion is "failure" rather than "cancelled".
        timeout-minutes: 35
        run: bun run scraper -- --storage=r2 --country=${{ matrix.country }}

  finalize:
    name: Regenerate root manifest
    runs-on: ubuntu-latest
    needs: scrape
    # Run even when some country jobs failed so the manifest is always fresh
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Regenerate root manifest.json
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: bun run scraper -- --storage=r2 --manifest-only

      - name: Per-country summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Scrape results by country"
            echo
            echo "| Country | Result | Duration |"
            echo "|---|---|---|"
            gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("scrape (")) | [.name[8:-1], .conclusion, ((((.completed_at // now | if type=="string" then fromdate else . end) - (.started_at | fromdate)) / 60 | floor | tostring) + " min")] | "| " + join(" | ") + " |"' | sort
            echo
            echo "Scrape matrix aggregate: \`${{ needs.scrape.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Open failure issue
    runs-on: ubuntu-latest
    needs: scrape
    # failure() is false when jobs are cancelled (e.g. job timeout), so also
    # check the aggregate matrix result explicitly.
    if: always() && (needs.scrape.result == 'failure' || needs.scrape.result == 'cancelled')
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "$GH_REPO" \
            --title "Scraper failure — ${{ github.run_id }}" \
            --label "scraper-failure" \
            --body "$(cat <<'EOF'
          One or more country jobs failed in the scraper workflow.

          **Run:** $RUN_URL
          **Triggered by:** ${{ github.event_name }}
          **Ref:** ${{ github.ref }}

          Check the run linked above for per-country logs and step summaries.
          EOF
          )"
