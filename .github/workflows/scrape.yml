name: Scrape Catalogs

on:
  schedule:
    # Monday and Thursday at 6am UTC (most catalogs refresh weekly)
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 4"
  workflow_dispatch: {} # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        country:
          - austria
          - belgium
          - bulgaria
          - croatia
          - czechia
          - denmark
          - estonia
          - finland
          - france
          - germany
          - greece
          - hungary
          - ireland
          - italy
          - latvia
          - lithuania
          - netherlands
          - norway
          - poland
          - portugal
          - romania
          - serbia
          - slovakia
          - slovenia
          - spain
          - sweden
          - switzerland
          - uk

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Install Playwright browsers
      - name: Install Playwright
        run: cd packages/scraper && bunx playwright install chromium --with-deps

      - name: Scrape ${{ matrix.country }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: bun run scraper -- --storage=r2 --country=${{ matrix.country }}
