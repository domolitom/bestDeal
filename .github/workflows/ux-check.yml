name: Post-Deploy UX Check

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ux-check-master
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  BASE_URL: https://best-deal-shops.com
  CDN_URL: https://cdn.best-deal-shops.com

jobs:
  ux-check:
    name: Structural UX assertions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Give Cloudflare Pages time to build + deploy (typically 60-180s, 5 min is safe)
      - name: Wait for Cloudflare Pages deploy
        if: github.event_name == 'push'
        run: sleep 300

      - name: Run UX checks
        id: ux-check
        run: bash scripts/ux-check.sh "$BASE_URL"

      # ----------------------------------------------------------------
      # On failure: file or update a GitHub issue
      # ----------------------------------------------------------------
      - name: File or update GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titlePrefix = '[UX-CHECK]';
            const issueTitle = `${titlePrefix} Post-deploy regression on ${sha.slice(0, 7)}`;

            const body = [
              `## UX-Check regression detected`,
              ``,
              `**Commit:** [\`${sha.slice(0, 7)}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha})`,
              `**Workflow run:** ${runUrl}`,
              `**Branch:** ${context.ref}`,
              ``,
              `Check the workflow run logs for details on which assertions failed.`,
              ``,
              `---`,
              `_Auto-filed by the post-deploy UX-check workflow._`,
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ux-regression',
              per_page: 20,
            });

            // Don't duplicate for the same SHA
            const sameShortSha = sha.slice(0, 7);
            const existingSameSha = openIssues.find(i => i.title.includes(sameShortSha));
            if (existingSameSha) {
              console.log(`Existing issue for same SHA: #${existingSameSha.number} — adding a comment`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingSameSha.number,
                body: `Re-run of the same commit still failing.\n\n${body}`,
              });
              return;
            }

            // Don't open a second issue if one was filed in the last 24 hours
            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
            const recentIssue = openIssues.find(i =>
              i.title.startsWith(titlePrefix) && new Date(i.created_at) > oneDayAgo
            );
            if (recentIssue) {
              console.log(`Recent UX-check issue found (#${recentIssue.number}) — adding a comment instead`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: recentIssue.number,
                body: `New failure on \`${sha.slice(0, 7)}\`.\n\n${body}`,
              });
              return;
            }

            // Create labels best-effort
            for (const label of ['automated', 'ux-regression']) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: label === 'ux-regression' ? 'e4e669' : 'ededed',
                  });
                } catch { /* already exists or insufficient permissions — ignore */ }
              }
            }

            const { data: newIssue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body,
              labels: ['automated', 'ux-regression'],
            });

            console.log(`Opened issue #${newIssue.number}: ${newIssue.html_url}`);
